name: Build and deploy to cPanel

# Deploys only after CI has passed on main (K-035). Before 2026-10-10 this
# ran on every push to main in parallel with CI, so a failing build or test
# could still ship. Server files and SQL are still uploaded by hand
# (docs/DEPLOYMENT.md); this workflow ships dist/ only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # exactly the commit CI verified
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        # Public Clerk key from a repository variable (not a secret). Unset keeps the existing sign-in.
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build
      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./        # FTP account scoped to the gakinz folder
