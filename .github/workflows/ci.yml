name: CI

# Every push to main and every pull request is checked here. The release (deploy.yml) is the last
# job of this workflow and runs only when all the checks passed (K-138), so the first thing to
# notice a broken build is never the live site.

# Every pull request is checked, including PRs stacked on another feature
# branch, so each section is verified before it reaches main.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the previous run for the same ref, but never on main —
# a cancelled main run leaves the branch with no verdict at all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + lint + docs + unit tests + build
    runs-on: ubuntu-latest
    steps:
      # Full history, so the docs check can diff a pull request against its base.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      # pnpm first, so setup-node can cache its store. The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      # `--frozen-lockfile` deliberately, not a plain `pnpm install`: it installs
      # pnpm-lock.yaml exactly and fails on a lockfile that cannot be satisfied,
      # where a plain install would rewrite the lockfile to make itself work.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Lint is a plain gate: any ESLint error fails the build (K-002 closed 2026-11-11).
      - name: Lint
        run: pnpm run lint

      # Documents stay current (AGENTS.md, "Keeping documents current"): links
      # resolve, and on a pull request a server or schema change must update
      # the documents that record it. The base ref goes through env, not
      # straight into the script.
      - name: Docs check (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm run docs:check --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Docs check
        if: github.event_name != 'pull_request'
        run: pnpm run docs:check

      - name: Unit tests
        run: pnpm test

      # The build is a real gate: deploy.yml ships whatever `vite build`
      # produces, so a build that fails here is a deploy that would have shipped
      # a broken site.
      - run: pnpm run build

  server:
    name: PHP syntax + server integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli, curl, mbstring
          coverage: none

      # pnpm first, so setup-node can cache its store. The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: PHP syntax
        run: find server -name '*.php' -print0 | xargs -0 -n1 php -l

      # The runner's own MySQL, started here. Synthetic data only; the tests
      # refuse any non-local host and any database not named *_test.
      - name: Start MySQL
        run: sudo systemctl start mysql.service

      - name: Server integration tests
        run: pnpm run test:server
        env:
          GK_TEST_DB_HOST: 127.0.0.1
          GK_TEST_DB_USER: root
          GK_TEST_DB_PASS: root

  # Secrets and static analysis on every push and pull request (the house rule). gitleaks reads the
  # full history with .gitleaks.toml (false positives listed by exact value). Semgrep fails the job
  # on any finding; a false positive is marked inline as `nosemgrep: <rule-id> -- reason` only after
  # reading the code. Both tools are pinned: the binary by checksum, the image by digest.
  security:
    name: gitleaks + Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --config .gitleaks.toml .

      - name: Semgrep
        run: >
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
          semgrep scan --metrics=off --error
          --config p/php --config p/react --config p/typescript --config p/secrets
          server src scripts

  # Does this push change what a release sends or how it is built? A push that changes only documents
  # does not release (the old `paths-ignore` rule, now tested in scripts/deploy-needed.test.mjs).
  # Only on a push to main; on a pull request this job and the release below are skipped.
  changes:
    name: does this push need a release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.range.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - id: range
        run: node scripts/deploy-needed.mjs "$BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        env:
          BEFORE: ${{ github.event.before }}

  # The release. `needs` makes it wait for every check above: if any of them fails or is cancelled, this
  # job is skipped and nothing is uploaded. The secrets are passed through to deploy.yml, which holds the
  # SSH steps.
  deploy:
    name: release to gakinz.com
    needs: [verify, server, security, changes]
    if: needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
