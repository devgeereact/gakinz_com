<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      THIS HEAD IS THE FALLBACK, NOT THE SOURCE OF TRUTH.

      Every public route declares its own title, description, canonical, Open
      Graph and Twitter Card tags in src/marketing/components/Seo.tsx.

      At build time scripts/prerender.mjs renders each public page and replaces
      everything between the seo:start and seo:end markers with that page's own
      tags, so a crawler that never runs JavaScript still reads the right ones.
      What is left here is only for the SPA shell (dist/app-shell.html), which
      serves the CMS and any path that was not prerendered; React adds the page's
      tags once it runs.

      There is deliberately no canonical and no og:url here. A static
      canonical named the home page on every client-rendered route, beside the
      route's own (K-043). Keep the markers: the prerender fails without them.
    -->
    <!--seo:start-->
    <title>Gideon Akinlotan · designer and developer, London</title>
    <meta
      name="description"
      content="I design and build websites for British businesses, and I stay on afterwards so they keep working. Selected work, what I do, and how to get in touch."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gideon Akinlotan" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Gideon Akinlotan · designer and developer, London" />
    <meta
      property="og:description"
      content="I design and build websites for British businesses, and I stay on afterwards so they keep working."
    />
    <meta property="og:image" content="https://gakinz.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gideon Akinlotan, designer and developer, London" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gideon Akinlotan · designer and developer, London" />
    <meta
      name="twitter:description"
      content="I design and build websites for British businesses, and I stay on afterwards so they keep working."
    />
    <meta name="twitter:image" content="https://gakinz.com/og.png" />
    <!--seo:end-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Graphite, matching the public site (D-046), so a mobile browser's chrome does not flash white. -->
    <meta name="theme-color" content="#0F151D" />
  </head>
  <body>
    <div id="root"></div>
    <!--noscript:start-->
    <noscript>
      <!--
        Not a substitute for the site, and not pretending to be. It exists so that a
        visitor with JavaScript disabled is told what this is and given a way to make
        contact, rather than being shown an empty page.
      -->
      <main style="font-family: Georgia, serif; max-width: 42rem; margin: 4rem auto; padding: 0 1.25rem; color: #1C1A16; background: #F6F3ED;">
        <h1 style="font-weight: 400;">Gideon Akinlotan</h1>
        <p>Designer and developer, London.</p>
        <p>
          I design and build websites for British businesses, and I stay on afterwards
          so they keep working.
        </p>
        <p>
          This site needs JavaScript to show the rest. If you would rather not enable
          it, email me at
          <a href="mailto:hello@gakinz.com" style="color: #2A3160;">hello@gakinz.com</a>
          and I will reply.
        </p>
      </main>
    </noscript>
    <!--noscript:end-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
